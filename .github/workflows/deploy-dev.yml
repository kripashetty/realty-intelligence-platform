name: Deploy Dev

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    name: Deploy dev infrastructure
    runs-on: ubuntu-latest
    environment: dev

    env:
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      SHARED_RESOURCE_GROUP: ${{ vars.SHARED_RESOURCE_GROUP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Verify Azure context
        run: |
          set -euo pipefail

          az account show \
            --query '{
              subscription:name,
              subscriptionId:id,
              tenantId:tenantId
            }' \
            --output jsonc

      - name: Ensure shared resource group exists
        run: |
          set -euo pipefail

          az group create \
            --name "$SHARED_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --tags application=realty scope=shared managedBy=bicep \
            --output none

      - name: Deploy shared infrastructure
        id: shared
        run: |
          set -euo pipefail

          DEPLOYMENT_NAME="realty-shared-${GITHUB_RUN_NUMBER}"

          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$SHARED_RESOURCE_GROUP" \
            --template-file infra/shared/main.bicep \
            --parameters infra/shared/parameters/shared.bicepparam \
            --output json > shared-deployment.json

          ACR_NAME="$(
            jq -r '.properties.outputs.acrName.value' \
              shared-deployment.json
          )"

          ACR_LOGIN_SERVER="$(
            jq -r '.properties.outputs.acrLoginServer.value' \
              shared-deployment.json
          )"

          {
            echo "acr-name=$ACR_NAME"
            echo "acr-login-server=$ACR_LOGIN_SERVER"
            echo "shared-resource-group=$SHARED_RESOURCE_GROUP"
          } >> "$GITHUB_OUTPUT"

      - name: Show shared outputs
        run: |
          echo "ACR name: ${{ steps.shared.outputs.acr-name }}"
          echo "ACR login server: ${{ steps.shared.outputs.acr-login-server }}"
          echo "Shared resource group: ${{ steps.shared.outputs.shared-resource-group }}"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      
      - name: Login to Azure Container Registry
        run: |
          set -euo pipefail

          az acr login \
            --name "${{ steps.shared.outputs.acr-name }}"

      - name: Set backend image
        id: image
        run: |
          set -euo pipefail

          IMAGE="${{ steps.shared.outputs.acr-login-server }}/realty-backend:${GITHUB_SHA}"

          echo "backend-image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.backend-image }}


      - name: Ensure dev resource group exists
        env:
              DEV_RESOURCE_GROUP: ${{ vars.DEV_RESOURCE_GROUP }}
        run: |
            set -euo pipefail
            az group create \
              --name "$DEV_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --output none
        
      - name: Deploy dev environment
        id: environment
        env:
            BACKEND_IMAGE: ${{ steps.image.outputs.backend-image }}
            POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
            set -euo pipefail

            RESOURCE_GROUP="realty-dev-rg"
            DEPLOYMENT_NAME="realty-dev-${GITHUB_RUN_NUMBER}"

            az deployment group validate \
              --resource-group "$RESOURCE_GROUP" \
              --name "${DEPLOYMENT_NAME}-validate" \
              --parameters infra/environment/parameters/dev.bicepparam \
              --output none

            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$DEPLOYMENT_NAME" \
              --parameters infra/environment/parameters/dev.bicepparam \
              --output json \
              > environment-deployment.json

            jq '.properties.outputs' environment-deployment.json

      - name: Capture environment outputs
        id: environment-outputs
        run: |
          set -euo pipefail

          ENVIRONMENT_RESOURCE_GROUP="$(
            jq -er '.properties.outputs.resourceGroupName.value' \
              environment-deployment.json
          )"

          BACKEND_NAME="$(
            jq -er '.properties.outputs.backendName.value' \
              environment-deployment.json
          )"

          BACKEND_URL="$(
            jq -er '.properties.outputs.backendUrl.value' \
              environment-deployment.json
          )"

          MIGRATION_JOB_NAME="$(
            jq -er '.properties.outputs.migrationJobName.value' \
              environment-deployment.json
          )"

          OLLAMA_BOOTSTRAP_JOB_NAME="$(
            jq -er '.properties.outputs.ollamaBootstrapJobName.value' \
              environment-deployment.json
          )"

          STATIC_WEB_APP_NAME="$(
            jq -er '.properties.outputs.frontendName.value' \
              environment-deployment.json
          )"

          {
            echo "resource-group=$ENVIRONMENT_RESOURCE_GROUP"
            echo "backend-name=$BACKEND_NAME"
            echo "backend-url=$BACKEND_URL"
            echo "migration-job-name=$MIGRATION_JOB_NAME"
            echo "ollama-job-name=$OLLAMA_BOOTSTRAP_JOB_NAME"
            echo "static-web-app-name=$STATIC_WEB_APP_NAME"
          } >> "$GITHUB_OUTPUT"
        
